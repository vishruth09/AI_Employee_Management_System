<!DOCTYPE html>
<html>
<head>
    <title>Upload Employee Document</title>
</head>
<body>

    <h1>AI Employee Management System</h1>
    <h2>Upload Employee Document</h2>

    <hr>

    <form method="POST" enctype="multipart/form-data">

        <label>Employee ID</label><br>
        <input type="text" name="employee_id" required><br><br>

        <label>Select Document</label><br>
        <input type="file" name="document" required><br><br>

        <button type="submit">Upload Document</button>

    </form>

    <br>

    <a href="/dashboard">Back to Dashboard</a>

</body>
</html>
